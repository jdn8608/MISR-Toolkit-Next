name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  python-packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libhdfeos-dev \
            libhdf4-alt-dev \
            libhdf5-dev \
            libjpeg-dev \
            libnetcdf-dev \
            zlib1g-dev

      - name: Configure native dependency environment
        run: |
          compat_dir="${RUNNER_TEMP}/mtk-lib-compat"
          mkdir -p "${compat_dir}"
          ln -sf /usr/lib/x86_64-linux-gnu/libmfhdfalt.so "${compat_dir}/libmfhdf.so"
          ln -sf /usr/lib/x86_64-linux-gnu/libdfalt.so "${compat_dir}/libdf.so"
          printf 'void __mtk_empty_gctp(void) {}\n' > "${compat_dir}/empty.c"
          gcc -fPIC -shared "${compat_dir}/empty.c" -o "${compat_dir}/libGctp.so"
          {
            echo "MTK_SOURCE_ROOT=${GITHUB_WORKSPACE}"
            echo "HDFEOS_INC=/usr/include/x86_64-linux-gnu/hdf"
            echo "HDFEOS_LIB=/usr/lib/x86_64-linux-gnu"
            echo "GCTPINC=${GITHUB_WORKSPACE}/win64/hdfeos_2.19/include"
            echo "GCTPLIB=${compat_dir}"
            echo "NCINC=/usr/include"
            echo "NCLIB=/usr/lib/x86_64-linux-gnu"
            echo "JPEGINC=/usr/include"
            echo "JPEGLIB=/usr/lib/x86_64-linux-gnu"
            echo "HDF5INC=/usr/include/hdf5/serial"
            echo "HDF5LIB=/usr/lib/x86_64-linux-gnu/hdf5/serial"
            echo "HDFINC=/usr/include/hdf"
            echo "HDFLIB=${compat_dir}"
            echo "LD_LIBRARY_PATH=${compat_dir}:${LD_LIBRARY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Build native MISR Toolkit library
        run: |
          make lib \
            VPATH="${GITHUB_WORKSPACE}/win64/hdfeos_2.19/include" \
            ADDITIONAL_CFLAGS='-Wno-error=stringop-truncation -Wno-error=stringop-overflow -Wno-error=maybe-uninitialized -Wno-error=unused-function'

      - name: Install Python build frontend
        run: python -m pip install -U build

      - name: Build Python source and wheel distributions
        working-directory: wrappers/python
        run: python -m build

      - name: Smoke install built wheel
        working-directory: wrappers/python
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import MisrToolkit; print(MisrToolkit.__file__)"

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: misrtoolkit-python-dist
          path: wrappers/python/dist/*

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
